server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Soporte para rutas del SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
