# Reverse proxy para La Canasta
# Dominio: canasta.mermelada.fun
#
# - /api/      -> backend  (contenedor en 127.0.0.1:8011)
# - /api-docs  -> backend  (Swagger)
# - /health    -> backend
# - /          -> frontend (contenedor en 127.0.0.1:8010)
#
# Copiar a /etc/nginx/sites-available/ y activarlo (ver pasos abajo).
# Certbot añadirá automáticamente el bloque 443 (HTTPS) al ejecutarlo.

server {
    listen 80;
    listen [::]:80;
    server_name canasta.mermelada.fun;

    # Tamaño máximo de subida (por si suben imágenes, etc.)
    client_max_body_size 10M;

    # ---- API del backend ----
    location /api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Swagger ----
    location /api-docs {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Healthcheck ----
    location /health {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
    }

    # ---- Frontend (SPA React) ----
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
