services:
  db:
    image: postgres:16-alpine
    container_name: canasta-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-canasta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canasta}
      POSTGRES_DB: ${POSTGRES_DB:-canasta}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "8012:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-canasta}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: canasta-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-canasta}:${POSTGRES_PASSWORD:-canasta}@db:5432/${POSTGRES_DB:-canasta}
      JWT_SECRET: ${JWT_SECRET:-cambia-esto-por-un-secreto-largo-y-aleatorio}
      PORT: 8011
    ports:
      - "8011:8011"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # URL pública del backend que usará el navegador.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8011/api}
    container_name: canasta-frontend
    restart: unless-stopped
    ports:
      - "8010:80"
    depends_on:
      - backend

volumes:
  pgdata:
